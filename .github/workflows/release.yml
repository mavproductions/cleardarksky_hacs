name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the changelog section for this version
          VERSION="${{ steps.version.outputs.version }}"

          # Read CHANGELOG.md and extract the section for this version
          if grep -q "## \[${VERSION}\]" CHANGELOG.md; then
            CHANGELOG=$(sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d' | tail -n +2)
          else
            CHANGELOG="See CHANGELOG.md for details."
          fi

          # Save to output
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Verify version matches manifest.json
        run: |
          MANIFEST_VERSION=$(grep -o '"version": "[^"]*"' custom_components/cleardarksky/manifest.json | cut -d'"' -f4)
          TAG_VERSION="${{ steps.version.outputs.version }}"

          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "   manifest.json: $MANIFEST_VERSION"
            echo "   Git tag: $TAG_VERSION"
            exit 1
          fi

          echo "✅ Version $TAG_VERSION matches manifest.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: v${{ steps.version.outputs.version }}
          body: |
            # Clear Dark Sky v${{ steps.version.outputs.version }}

            ${{ steps.changelog.outputs.notes }}

            ---

            ## Installation

            ### Via HACS (Recommended)
            If you already have this integration installed via HACS, the update should appear automatically.

            ### Manual Installation
            1. Download `cleardarksky.zip` below
            2. Extract to your `custom_components` directory
            3. Restart Home Assistant

            ## Full Changelog
            See [CHANGELOG.md](https://github.com/mavproductions/cleardarksky_hacs/blob/main/CHANGELOG.md) for complete version history.
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
